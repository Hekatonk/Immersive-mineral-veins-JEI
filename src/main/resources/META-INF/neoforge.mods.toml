[[mods]]
modId = "mineralveinsjei"
version = "1.0.0"
displayName = "Immersive Mineral Veins JEI"
authors = "Hekatonk"
description = '''
Adds the JEI category Immersive Engineering never shipped: the Excavator's mineral veins.

Each vein shows its ores with their normalised chances, its spoils, its biomes,
its vein weight and its barren chance. The Excavator is a catalyst, so looking up
its uses lists every vein. Veins are read from the loaded recipes, so datapack
overrides are reflected rather than IE's defaults.
'''
displayURL = "https://github.com/Hekatonk/Immersive-mineral-veins-JEI"

